[package]
name = "plateau-to-glb"
version = "0.1.0"
description = "PLATEAUtoGLB デスクトップ版（Windows）"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
# PlotBlock と同じ版にそろえる（動作実績のある組み合わせ）
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
# 保存先を選ぶ窓（Windows の標準の「名前を付けて保存」）
rfd = { version = "=0.17.2" }

[profile.release]
# 配るファイルを小さくする（自動ビルドの時間を抑えるため、時間のかかる最適化〔lto〕は使わない）
opt-level = "s"
strip = true
