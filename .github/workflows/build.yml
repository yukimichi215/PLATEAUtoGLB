# 自動ビルド（規則 CLAUDE.md §6 に従う）
# ・作業ブランチ・PR：検査とビルドができるかの確認だけ（できたファイルは保存しない）
# ・main に取り込まれたときも同じ確認だけ（ブラウザ版に一本化したので、配るファイルは作らない）
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# 同じブランチに新しい push が来たら、動いている古いビルドは止める
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 検査（型チェック・テスト・画面のビルド）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
